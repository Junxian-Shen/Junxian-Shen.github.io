# 用 **加粗**、*斜体*；每个 biography 条目是一段。
headline: "Understanding the systems behind *every request.*"
headline_zh: "理解每一次请求背后的系统"
biography:
  - >-
    Junxian is currently an Assistant Professor at the School of Computer Science
    & Engineering, South China University of Technology. He received his Ph.D.
    at the Institute of Network Science and Cyberspace, Tsinghua University,
    advised by Prof. Jilong Wang, Prof. Mingwei Xu, and Assoc. Prof. Han Zhang.
    He received his B.Eng. in the Department of Computer Science and Technology
    at Tsinghua University in July 2019, advised by the late Prof. Jun Bi.
  - >-
    Junxian's research focuses on **large-scale cloud and network infrastructure
    monitoring**. Leveraging the Future Internet Technology Infrastructure (FITI),
    a major national scientific and technological infrastructure project under
    China's 13th Five-Year Plan, his work has led to publications at conferences
    and journals including **ACM SIGCOMM**, **ACM CCS**, and **IEEE TPDS**.

biography_zh:
  - "沈俊贤现任华南理工大学计算机科学与工程学院助理教授。他在清华大学网络科学与网络空间研究院获得博士学位，导师为王继龙教授、徐明伟教授和张晗副教授；于 2019 年 7 月在清华大学计算机科学与技术系获得学士学位，师从已故毕军教授。"
  - "他的研究主要聚焦于**大规模云与网络基础设施监测**。依托国家“十三五”重大科技基础设施项目——未来互联网试验设施（FITI），相关研究成果发表于 **ACM SIGCOMM**、**ACM CCS** 和 **IEEE TPDS** 等会议与期刊。"

